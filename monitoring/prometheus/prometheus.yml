# Prometheus scrape configuration for CloudDB Sentinel

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: clouddb_sentinel
    environment: development

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: clouddb-backend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mysqld-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
